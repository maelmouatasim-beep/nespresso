name: Qualité

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: pip install -e ".[dev]"
      - name: Lint et format (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy, moteurs et domaine)
        run: mypy
      - name: Tests (dont parité Excel 416/416)
        run: pytest -q
