[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-planning-copilot"
version = "0.1.0"
description = "Outil interne de planification des commandes boutiques (Nespresso Canada)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2",
    "openpyxl>=3.1",
    "python-calamine>=0.3",  # lecture Excel rapide (exports Power BI de ~90 000 lignes)
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mise en page de l'interface : lignes longues tolérées.
"app/ui/**/*.py" = ["E501"]
"tools/build_demo_app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app/domain", "app/engines"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
