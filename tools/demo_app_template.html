<style>

    --border: #3b352f; --accent: #e0a878; --accent-fg: #1d1712; --accent-soft: #3a2b20;
    --ok: #8fd4a1; --ok-bg: #1d3324; --review: #f3c26a; --review-bg: #3b2e15;
    --blocked: #f39c9c; --blocked-bg: #3e1f1f; --mod: #8fb6f5; --mod-bg: #1c2a40;
    --side: #0f0d0b; --side-fg: #efe7df; --side-muted: #9c8f82; --side-on: #2f261f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171412; --surface: #211d1a; --surface-2: #2b2622; --text: #f1ece6; --muted: #a79f95;
  --border: #3b352f; --accent: #e0a878; --accent-fg: #1d1712; --accent-soft: #3a2b20;

<script>
const DATA = /*__DATA__*/null;
const M = DATA.meta, L = DATA.lines, T = DATA.text;
const PAGES = ["1. Dépôt du jour", "2. Commande boutique", "3. Journée", "4. Export", "5. Référentiels", "6. Historique"];
const STATUS = { O: "OK", R: "REVIEW", B: "BLOCKED" };
const SRC = { forecast: "Prévision", allocation: "Allocation", launch: "Lancement", target_stock: "Stock cible", dc_return: "Retour DC", exclusion: "Exclusion", override: "Modifié" };
const MSRC = { multiple_list: "Multiple list", multiple_list_family: "famille (deux multiples)", inferred_family: "inféré (famille)", excel_default_1: "absent → 1 (Excel)", missing_default_1: "absent" };
const CAT = Object.fromEntries(M.categories);
const CATEGORY_FILTERS = ["Tous", ...DATA.category_names];
const STATUS_FILTERS = ["Tous", "OK", "REVIEW", "BLOCKED", "Modifié"];
const MODES = { "Standard": "standard", "Parité Excel": "excel_parity" };
const MODE_LABEL = { standard: "Standard", excel_parity: "Parité Excel" };
const NAMES = Object.fromEntries(DATA.boutiques);
const PLANNED = Object.fromEntries(DATA.planned);
const FR_DAYS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const nf0 = new Intl.NumberFormat("fr-CA", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("fr-CA", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt = x => x === null || x === undefined || Number.isNaN(x) ? "—" : nf0.format(x);
const fmt1 = x => x === null || x === undefined || Number.isNaN(x) ? "—" : nf1.format(x);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fdate = s => { if (!s) return "—"; const d = parseIso(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); };
const frday = s => { const d = parseIso(s); return FR_DAYS[d.getDay()] + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1); };
const btqLabel = b => NAMES[b] ? b + " — " + NAMES[b] : b;
const $ = id => document.getElementById(id);
const isAttrs = x => x && typeof x === "object" && !(x instanceof Node) && !Array.isArray(x);
function el(tag, attrs, ...kids) {

  else if (isAttrs(attrs)) sets.push(attrs);

  }

  return e;
}
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

const st = {
  page: store.get("spc2_page", PAGES[0]), author: store.get("spc_author", ""), examples: store.get("spc2_examples", true),
  form: { boutique: "", delivery: "", cover: "", coffee: "", mode: "standard" }, order: null, err: "",
  overrides: {}, pending: {}, seen: new Set(), f: { cat: "Tous", status: "Tous", qty: false }, sort: null, q: "", why: null, gear: false, savedId: null, xmsg: null,
  day: null, refTab: 0,
};

// Catégories : table du référentiel (modifiable dans Référentiels, gardée dans ce navigateur).
function categories() { return store.get("spc2_categories", null) || DATA.category_map; }

// ---------- Résultat pré-calculé ----------
function variantKey(mode) { return mode + "|" + (st.examples ? "examples" : "none"); }
function baseLine(j) {
  const o = st.order, v = DATA.variants[variantKey(o.mode)], m = L[v.sel[j]];
  const cell = v.res[j], ci = m.coffee && o.coffee !== "" ? +o.coffee : +o.cover;
  const t = Array.isArray(cell[0]) ? cell[ci] : cell;
  const [qty, raw, s, rids, multiple, msrc, source, fq, fbs, bzs, flags] = t;
  return { m, qty, raw, s, reasons: rids.map(i => T[i]), multiple, msrc: T[msrc], source, fq, fb: fbs < 0 ? null : T[fbs], biz: bzs < 0 ? null : T[bzs],
           conv: !!(flags & 1), dcr: !!(flags & 2), cover: M.covers[ci], coffeeCover: m.coffee && o.coffee !== "" };

function finalLine(j) {

  if (ov.final !== ov.after) reasons.push("Saisie " + ov.after + " arrondie au multiple de " + (b.multiple || 1) + " : " + ov.final);

// Même règle que le moteur d'overrides : la saisie est arrondie au multiple supérieur.
function roundToMultiple(q, multiple) { const m = multiple > 0 ? multiple : 1; return Math.ceil(q / m) * m; }
function lines() { if (!st.order) return []; const n = DATA.variants[variantKey(st.order.mode)].sel.length; const out = []; for (let j = 0; j < n; j++) out.push(finalLine(j)); return out; }
function postCover(m, qty) { return m.sales > 0 ? (m.exp + qty) / m.sales * M.history_days : null; }

  const pal = { VL: 0, OL: 0, MACHINES: 0, OTHERS: 0 }, by = { O: 0, R: 0, B: 0 }; let units = 0, ordered = 0; const noPal = [];
  for (const x of ls) {

      el("button", { class: "btn", onclick: () => { st.catDraft.push({ t: "", c: "Autres" }); render(); } }, "Ajouter un type"),
      el("button", { class: "btn primary", id: "save_cats", onclick: () => {
        if (!st.author) return msg.replaceChildren(el("div", "msg err", "Indique ton nom dans la barre de gauche."));
        const map = {}, errs = [];
        st.catDraft.forEach((r, i) => { const t = r.t.trim().toUpperCase(); if (!t) errs.push("ligne " + (i + 1) + " : type produit vide"); else if (map[t] && map[t] !== r.c) errs.push("type " + t + " déjà classé en « " + map[t] + " »"); else map[t] = r.c; });
        if (errs.length) return msg.replaceChildren(el("div", "msg err", errs.join(" · ")));
        store.set("spc2_categories", map); st.catDraft = null; render();
        $("catmsg")?.replaceChildren(el("div", "msg ok", Object.keys(map).length + " type(s) produit enregistré(s) dans ce navigateur."));
      } }, "Enregistrer les catégories"),
      el("button", { class: "btn", onclick: () => { try { localStorage.removeItem("spc2_categories"); } catch (e) { /* stockage bloqué */ } st.catDraft = null; render(); } }, "Revenir au classement du planner")),
    el("div", { id: "catmsg" }, msg)];
}

// ---------- 6. Historique ----------
function renderHistory() {
  const out = [el("h1", "", "Historique")], runs = store.get("spc2_runs", []);
  if (!runs.length) return [...out, el("div", "msg info", "Aucune commande enregistrée pour l'instant."), el("p", "small muted", "Dans cette démo, les commandes restent dans ton navigateur. Dans l'outil installé, elles vont dans la base locale.")];
  out.push(tableOf(["N°", "Boutique", "Créé le", "Par", "Livraison", "Cover", "Mode", "Lignes", "Unités", "Fichier LT"],
    runs.map(r => [String(r.id), r.boutique, r.created.slice(0, 16).replace("T", " "), r.author, fdate(r.delivery), fmt1(r.cover), MODE_LABEL[r.mode], fmt(r.lines), fmt(r.units), el("span", "mono", r.lt || "")]), [0, 5, 7, 8]));
  out.push(el("h3", "", "Modifications des planners"));
  const ovs = runs.flatMap(r => r.overrides.map(o => ({ ...o, boutique: r.boutique })));
  if (!ovs.length) out.push(el("div", "msg info", "Aucune modification enregistrée."));
  else {
    const count = key => Object.entries(ovs.reduce((a, o) => { const k = key(o); a[k] = (a[k] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]);
    out.push(el("div", "two", tableOf(["Catégorie", "Modifications"], count(o => CAT[o.cat]).map(([k, v]) => [k, fmt(v)]), [1]),
      tableOf(["SKU le plus modifié", "Fois"], count(o => o.sku).slice(0, 15).map(([k, v]) => [el("span", "mono", k), fmt(v)]), [1])));
    out.push(el("details", { style: "margin-top:8px" }, el("summary", "", "Détail (" + ovs.length + ")"),
      tableOf(["Boutique", "SKU", "Avant", "Après", "Catégorie", "Raison", "Par", "Quand"], ovs.map(o => [o.boutique, el("span", "mono", o.sku), fmt(o.before), fmt(o.final), CAT[o.cat], o.reason, o.author, o.ts.slice(0, 16).replace("T", " ")]), [2, 3])));
  }
  out.push(el("h3", "", "Comparer deux commandes"));
  const lab = r => "n° " + r.id + " · " + r.boutique + " · " + r.created.slice(0, 16).replace("T", " ");
  const a = el("select", { id: "cmp_a" }, runs.map(r => el("option", { value: r.id }, lab(r)))), b = el("select", { id: "cmp_b" }, runs.map(r => el("option", { value: r.id }, lab(r))));
  a.value = String(st.cmpA ?? runs[Math.min(1, runs.length - 1)].id); b.value = String(st.cmpB ?? runs[0].id);
  a.onchange = () => { st.cmpA = +a.value; render(); }; b.onchange = () => { st.cmpB = +b.value; render(); };
  out.push(el("div", "two", el("label", "f", "Commande A", a), el("label", "f", "Commande B", b)));
  const ra = runs.find(r => r.id === +a.value), rb = runs.find(r => r.id === +b.value);
  if (ra && rb && ra.id !== rb.id) {
    const skus = [...new Set([...Object.keys(ra.qty), ...Object.keys(rb.qty)])].sort();
    const diff = skus.map(s => [s, ra.qty[s] || 0, rb.qty[s] || 0]).filter(([, x, y]) => x !== y);
    out.push(el("p", "", el("b", "", diff.length + " SKU dont la quantité change")));
    if (diff.length) out.push(tableOf(["SKU", "A", "B", "Écart"], diff.map(([s, x, y]) => [el("span", "mono", s), fmt(x), fmt(y), (y - x > 0 ? "+" : "") + fmt(y - x)]), [1, 2, 3]));
  }
  return out;
}

const SCREENS = { [PAGES[0]]: renderDepot, [PAGES[1]]: renderOrder, [PAGES[2]]: renderDay, [PAGES[3]]: renderExport, [PAGES[4]]: renderRefs, [PAGES[5]]: renderHistory };
let rendering = false;
function render() {
  // Un champ retiré pendant le rendu peut déclencher « change » : on reporte ce rendu-là.
  if (rendering) { queueMicrotask(render); return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
}
function draw() {
  renderNav();
  const main = $("main"), g = $("grid"), keep = g ? [g.scrollTop, g.scrollLeft] : null;
  main.replaceChildren(...(SCREENS[st.page] || renderDepot)().filter(Boolean), el("footer", "", "Moteurs : " + Object.values(M.rule_versions).join(" · ") + " · aucune quantité n'est calculée par le navigateur ni par une IA."));
  const g2 = $("grid"); if (g2 && keep) { g2.scrollTop = keep[0]; g2.scrollLeft = keep[1]; }
  renderDock(); renderWhy();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && st.why) { st.why = null; render(); } });
render();
</script>
